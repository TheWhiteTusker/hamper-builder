[package]
name = "lattice-worker"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false
description = "The few server-side jobs that need a secret: GST lookup and the nightly Recycle Bin purge."

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
lattice-core = { path = "../crates/core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
